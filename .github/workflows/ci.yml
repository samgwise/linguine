name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep PR feedback fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a v2.x release built with Go 1.25 so the linter can
          # analyze the project's go 1.25.0 code. v1.x binaries are built
          # with Go 1.24 and refuse to load a go 1.25 module; the v2 config
          # schema in .golangci.yml also requires golangci-lint v2.
          version: v2.12
          args: --timeout 5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all packages
        run: go build ./...
      # Smoke-build the two release binaries CGO-free, the same way the
      # release workflow does, so a cross-compile breakage surfaces here
      # rather than on a tagged release.
      - name: Smoke-build release binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/linguine ./cmd/linguine
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/linguine-worker ./cmd/worker
          /tmp/linguine --help || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
