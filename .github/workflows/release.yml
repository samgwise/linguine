name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # CGO-free (modernc.org/sqlite), so cross-compilation needs no C toolchain.
      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/linguine ./cmd/linguine
          go build -trimpath -ldflags '-s -w' -o dist/linguine-worker ./cmd/worker
      - name: Tarball + checksum
        run: |
          cd dist
          tar -czf linguine-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz linguine linguine-worker
          shasum -a 256 linguine-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            > linguine-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: linguine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/linguine-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz*
